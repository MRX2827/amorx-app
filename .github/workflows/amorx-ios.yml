name: AmorX iOS IPA
on:
  push:
    branches: [codex/amorx-native]
    paths:
      - 'ios/**'
      - '.github/workflows/amorx-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amorx-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Check project generation and shared music contracts
        run: |
          set -euo pipefail
          python3 ios/Tools/generate_project.py
          git diff --exit-code -- ios/AmorX.xcodeproj
          plutil -lint ios/AmorX/Info.plist ios/AmorX.xcodeproj/project.pbxproj
          swift test --package-path ios --jobs 3
      - name: Prepare matching iPhone simulator
        run: python3 ios/Tools/simulator_smoke.py prepare
      - name: Build unsigned Release for iPhone and iPad
        run: |
          set -euo pipefail
          mkdir -p ios/build
          xcodebuild -resolvePackageDependencies -project ios/AmorX.xcodeproj -scheme AmorX
          xcodebuild -project ios/AmorX.xcodeproj -scheme AmorX -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/build/device-build.log
          python3 ios/Tools/package_ipa.py
      - name: Compile iPhone simulator Release
        run: |
          set -euo pipefail
          xcodebuild -project ios/AmorX.xcodeproj -scheme AmorX -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios/build/simulator-build.log
      - name: Verify Release startup
        id: startup
        run: python3 ios/Tools/simulator_smoke.py startup
      - name: Verify compact and larger layouts
        id: layouts
        run: python3 ios/Tools/simulator_smoke.py layouts
      - name: Verify native audio downloads
        if: ${{ !cancelled() && steps.startup.outcome == 'success' }}
        run: python3 ios/Tools/simulator_smoke.py downloads
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AmorX-iOS-5.5.499.1330
          path: |
            ios/build/AmorX-iOS-5.5.499.1330.ipa
            ios/build/ipa-verification.json
            ios/build/simulator-verification.json
            ios/build/layout-verification.json
            ios/build/download-verification.json
            ios/build/layout-screenshots/*.png
            ios/build/ios-launch.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AmorX-iOS-build-diagnostics
          path: |
            ios/build/*.log
            ios/build/simulator-environment.json
            ios/build/layout-verification.json
            ios/build/download-verification.json
            ios/build/layout-screenshots/*.png
            ios/build/ios-launch.png
          if-no-files-found: ignore
          retention-days: 7
